<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作流引擎 - 蓝图设计器</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --handle-color: #475569;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, transparent 70%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 80px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header {
            margin-bottom: 32px;
            text-align: center;
        }

        .header h1 {
            margin: 0 0 8px 0;
            font-size: 24px;
            font-weight: 600;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        .step-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
        }

        .step-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            border-radius: 12px;
            transition: all 0.2s ease;
        }

        .step-item.dragging {
            opacity: 0.5;
            transform: scale(1.02);
            border-color: var(--primary);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .step-item.drag-over {
            border-top: 2px solid var(--primary);
        }

        .step-info {
            display: flex;
            flex-direction: column;
        }

        .step-name {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .step-id {
            font-size: 12px;
            color: var(--text-muted);
            font-family: monospace;
        }

        .drag-handle {
            cursor: grab;
            color: var(--handle-color);
            padding: 8px;
            transition: color 0.2s;
            display: flex;
            align-items: center;
        }

        .drag-handle:hover {
            color: var(--text-main);
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .save-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .save-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
        }

        .save-btn:active {
            transform: translateY(0);
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #22c55e;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 500;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
        }
        
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 id="chainName">加载中...</h1>
            <p id="chainId">ID: ----</p>
        </div>

        <div class="step-list" id="stepList">
            <!-- Nodes will be rendered here -->
        </div>

        <button class="save-btn" id="saveBtn" onclick="saveTemplate()">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
            保存并同步图纸
        </button>
    </div>
    
    <div class="toast" id="toast">✅ 图纸保存成功！</div>

    <script>
        let currentChain = null;

        // 获取数据
        async function loadData() {
            try {
                const res = await fetch('/api/chain');
                currentChain = await res.json();
                render();
            } catch(e) {
                console.error(e);
            }
        }

        function render() {
            if (!currentChain) return;
            
            document.getElementById('chainName').textContent = currentChain.template.name || '未命名流程';
            document.getElementById('chainId').textContent = `ID: ${currentChain.template.id}`;

            const listEl = document.getElementById('stepList');
            listEl.innerHTML = '';

            currentChain.steps.forEach((step, index) => {
                const el = document.createElement('div');
                el.className = 'step-item';
                el.draggable = true;
                el.dataset.index = index;
                
                el.innerHTML = `
                    <div class="step-info">
                        <span class="step-name">${index + 1}. ${step.template.name || '未命名步骤'}</span>
                        <span class="step-id">${step.template.id}</span>
                    </div>
                    <div class="drag-handle" title="按住拖拽">
                        <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"></path></svg>
                    </div>
                `;

                // Drag Events
                el.addEventListener('dragstart', handleDragStart);
                el.addEventListener('dragover', handleDragOver);
                el.addEventListener('drop', handleDrop);
                el.addEventListener('dragend', handleDragEnd);

                listEl.appendChild(el);
            });
        }

        // 拖拽逻辑
        let dragStartIndex = null;

        function handleDragStart(e) {
            dragStartIndex = +this.dataset.index;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            
            const list = document.getElementById('stepList');
            const draggingEl = document.querySelector('.dragging');
            const items = [...list.querySelectorAll('.step-item:not(.dragging)')];
            
            const nextEl = items.find(item => {
                const rect = item.getBoundingClientRect();
                return e.clientY <= rect.top + rect.height / 2;
            });
            
            if (nextEl) {
                list.insertBefore(draggingEl, nextEl);
            } else {
                list.appendChild(draggingEl);
            }
        }

        function handleDrop(e) {
            e.stopPropagation();
            return false;
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
            
            // Reconstruct array based on new DOM order
            const items = document.querySelectorAll('.step-item');
            const newSteps = [];
            items.forEach(item => {
                const originalIndex = +item.dataset.index;
                newSteps.push(currentChain.steps[originalIndex]);
            });
            
            currentChain.steps = newSteps;
            render(); // re-render to update numbers and indexes
        }

        // 保存逻辑
        async function saveTemplate() {
            const btn = document.getElementById('saveBtn');
            btn.innerHTML = '保存中...';
            btn.style.opacity = '0.7';

            try {
                const res = await fetch('/api/chain', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentChain)
                });
                
                if (res.ok) {
                    const toast = document.getElementById('toast');
                    toast.classList.add('show');
                    setTimeout(() => toast.classList.remove('show'), 3000);
                }
            } catch (e) {
                alert('保存失败: ' + e.message);
            } finally {
                btn.innerHTML = `<svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg> 保存并同步图纸`;
                btn.style.opacity = '1';
            }
        }

        // Init
        loadData();
    </script>
</body>
</html>
